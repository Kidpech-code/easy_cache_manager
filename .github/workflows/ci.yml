name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Browser storage (JavaScript)
        run: flutter test --platform chrome test/web_storage_test.dart
      - name: Browser storage (WASM)
        run: flutter test --platform chrome --wasm test/web_storage_test.dart
      - name: Build example (JavaScript)
        working-directory: example
        run: flutter build web --release
      - name: Build example (WASM)
        working-directory: example
        run: flutter build web --wasm --release
      - run: flutter pub publish --dry-run
